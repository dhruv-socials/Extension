<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Links</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>Job Links</h1>
    <input id="search" type="search" placeholder="Search platforms, notes, tags">
    <button id="add" class="primary">+ Add platform</button>
    <button id="export" class="ghost">Export</button>
    <button id="import" class="ghost">Import</button>
    <input id="file" type="file" accept="application/json" hidden>
  </header>
  <main>
    <div id="chips"></div>
    <ul id="list"></ul>
    <p id="empty" hidden>No platforms yet. Click "Add platform" to save your first one.</p>
  </main>

  <dialog id="dlg">
    <form id="form" autocomplete="off">
      <h2 id="dlgTitle">Add platform</h2>
      <label for="url">Link</label>
      <input id="url" type="text" placeholder="naukri.com or full link" required>
      <button type="button" id="useTab" class="ghost">Use the page I was on</button>
      <label for="name">Name <span>(optional)</span></label>
      <input id="name" type="text">
      <label for="tag">Tag <span>(optional, e.g. Company careers, Job board, Referral)</span></label>
      <input id="tag" type="text" list="tags">
      <datalist id="tags"></datalist>
      <label for="note">Note</label>
      <textarea id="note" rows="3" placeholder="What you use it for, login email, status..."></textarea>
      <p id="error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" id="cancel" class="ghost">Cancel</button>
        <button type="submit" id="save" class="primary">Add platform</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
