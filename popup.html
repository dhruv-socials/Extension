<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Links</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <form id="form" autocomplete="off">
    <div class="row">
      <input id="url" type="text" placeholder="Paste a job platform link" required>
      <button type="button" id="useTab" title="Fill in the link of the tab you are on">This tab</button>
    </div>
    <input id="name" type="text" placeholder="Name (optional, taken from the link if empty)">
    <textarea id="note" rows="2" placeholder="Note: what you use it for, login email, etc."></textarea>
    <div class="row actions">
      <button type="submit" id="save" class="primary">Add platform</button>
      <button type="button" id="cancel" class="ghost" hidden>Cancel</button>
    </div>
    <p id="error" role="alert" hidden></p>
  </form>

  <input id="search" type="search" placeholder="Search platforms and notes" hidden>
  <ul id="list"></ul>
  <p id="empty" hidden>No platforms yet. Paste a link above to add your first one.</p>

  <script src="popup.js"></script>
</body>
</html>
